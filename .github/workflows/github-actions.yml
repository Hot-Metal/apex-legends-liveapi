name: Build Libraries
run-name: Build Libraries
on: [push]

env:
  VERSION_NUMBER: 0.0.${{github.run_number}}

jobs:
  build-node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-node@v4
        with:
          node-version: 18
      # - name: Install Protoc
      #   uses: arduino/setup-protoc@v3
            # Very important: versions the package.json node version which is the version that publish looks for 
      # in the github release we create next
      - name: NPM version v0.0.${{github.run_number}}
        working-directory: ts/apex-legends-liveapi
        run: |
          npm version $VERSION_NUMBER --git-tag-version false
      - name: Build Node Library
        working-directory: ts/apex-legends-liveapi
        run: |
          pwd
          ls -la
          npm install
          npx tsc
    
    
